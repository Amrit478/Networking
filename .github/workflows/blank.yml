name: Network Automation CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down your repository code (Python, Jinja templates, YAML data)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install required network libraries (like Jinja2, PyYAML, Netmiko)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 pyyaml netmiko pytest

      # 4. Run a Python test script to render Jinja templates using your YAML data
      # This checks if your templates generate valid CLI commands without errors
      - name: Test Jinja Template Rendering
        run: |
          python scripts/test_render.py

      # 5. Run static code analysis (linting) on your Python scripts
      - name: Lint Python Code
        run: |
          flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
